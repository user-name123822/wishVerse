<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wish Verse</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated Background -->
    <div class="space"></div>
    <div class="stars"></div>

    <!-- Moon -->
    <div class="moon"></div>

    <!-- Shooting Stars -->
    <div class="shooting-star star-one"></div>
    <div class="shooting-star star-two"></div>
    <div class="shooting-star star-three"></div>

    <!-- Floating Particles -->
    <div class="particles"></div>

    <!-- Navigation -->
    <header>
        <div class="logo">love universe</div>

        <div class="menu">
            <span>♡</span>
        </div>
    </header>

    <!-- Main Content -->
    <main>

        <div class="eyebrow">
            ✦ A STORY MADE FOR TWO ✦
        </div>

        <h1>
            Some stories are written<br>
            <span>in the stars.</span>
        </h1>

        <p class="description">
            Welcome to your little universe —
            a place where memories live,
            wishes glow and two hearts become one story.
        </p>

        <button id="beginButton">
            <span>Begin the Journey</span>
            <b>→</b>
        </button>

        <div class="scroll">
            <div class="line"></div>
            <span>SCROLL TO EXPLORE</span>
        </div>

    </main>

    <!-- Bottom Quote -->
    <footer>
        <span>Made for moments that last forever</span>
        <span>∞</span>
    </footer>

    <script src="script.js"></script>

</body>
</html>
