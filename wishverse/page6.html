<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>A Universe Made Of You | Love Universe</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 35%,
            #30204b,
            #171426 45%,
            #06070c
        );

    color: white;

    font-family: Georgia, "Times New Roman", serif;

    overflow-x: hidden;
    overflow-y: auto;
}


/* STARS */

.space {
    position: fixed;
    inset: 0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.8) 1px,
            transparent 1px
        );

    background-size: 85px 85px;

    opacity: .4;

    pointer-events: none;
}


/* GLOW */

.glow {
    position: fixed;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    filter: blur(100px);

    pointer-events: none;
}

.glow-one {
    left: -150px;
    top: 20%;

    background: rgba(160,90,230,.15);
}

.glow-two {
    right: -150px;
    bottom: 10%;

    background: rgba(230,100,190,.12);
}


/* HEADER */

header {
    position: relative;
    z-index: 10;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 28px 45px;
}

.logo {
    font-size: 15px;

    font-weight: bold;

    letter-spacing: 4px;
}

.page {
    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 3px;

    opacity: .5;
}


/* MAIN */

main {
    position: relative;
    z-index: 5;

    min-height: calc(100vh - 80px);

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    padding: 20px 20px 90px;
}


/* TITLE */

.eyebrow {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 4px;

    color: #d7a8ed;

    margin-bottom: 15px;
}

h1 {
    font-size: clamp(44px, 6vw, 70px);

    font-weight: normal;

    font-style: italic;

    line-height: 1.08;

    margin-bottom: 10px;
}

h1 span {
    color: #e4a5d1;
}

.subtitle {
    max-width: 500px;

    font-family: Arial, sans-serif;

    font-size: 12px;

    line-height: 1.5;

    color: rgba(255,255,255,.55);

    margin-bottom: 15px;
}


/* UNIVERSE */

.universe {
    position: relative;

    width: 500px;
    height: 270px;

    max-width: 95vw;

    flex-shrink: 0;
}


/* ORBIT */

.orbit {
    position: absolute;

    width: 220px;
    height: 220px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border:
        1px solid rgba(220,170,240,.2);

    border-radius: 50%;
}


/* CENTER */

.center {
    position: absolute;

    width: 90px;
    height: 90px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #f0b5dc,
            #ad6fa5 55%,
            transparent 72%
        );

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 35px;

    box-shadow:
        0 0 30px rgba(235,150,215,.5);
}


/* STARS */

.star {
    position: absolute;

    width: 44px;
    height: 44px;

    border: none;

    border-radius: 50%;

    cursor: pointer;

    color: white;

    font-size: 17px;

    background:
        radial-gradient(
            circle,
            white 0%,
            #d9a3eb 25%,
            rgba(200,130,220,.15) 65%,
            transparent 70%
        );

    box-shadow:
        0 0 20px rgba(220,160,240,.6);

    z-index: 20;

    transition: .3s;
}

.star:hover {
    transform: scale(1.3);
}


/* STAR POSITIONS */

.star-one {
    left: 8%;
    top: 25%;
}

.star-two {
    right: 8%;
    top: 20%;
}

.star-three {
    left: 15%;
    bottom: 8%;
}

.star-four {
    right: 15%;
    bottom: 8%;
}

.star-five {
    left: 50%;
    top: 0;

    transform: translateX(-50%);
}


/* MESSAGE */

.message {
    position: absolute;

    left: 50%;
    bottom: 0;

    transform:
        translateX(-50%);

    width: 330px;

    max-width: 85vw;

    padding: 12px 18px;

    border:
        1px solid rgba(220,170,240,.2);

    border-radius: 14px;

    background:
        rgba(255,255,255,.05);

    backdrop-filter: blur(10px);

    opacity: 0;

    transition: .4s;

    z-index: 30;
}

.message.show {
    opacity: 1;
}

.message p {
    font-size: 12px;

    line-height: 1.5;

    font-style: italic;

    color: #f0d9ed;
}


/* INSTRUCTION */

.instruction {
    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    color: rgba(255,255,255,.45);

    margin-top: 0;
}


/* CONTINUE */

.continue {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    margin-top: 18px;

    padding: 12px 28px;

    border:
        1px solid rgba(255,255,255,.35);

    border-radius: 30px;

    background:
        rgba(255,255,255,.06);

    color: white;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 2px;

    position: relative;

    z-index: 100;

    opacity: 1;

    visibility: visible;

    transition: .3s;
}

.continue:hover {
    transform: translateY(-3px);

    background:
        rgba(220,140,200,.15);
}


/* FOOTER */

footer {
    position: fixed;

    bottom: 12px;

    left: 0;

    width: 100%;

    text-align: center;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    opacity: .3;

    z-index: 50;
}


/* MOBILE */

@media(max-width:600px) {

    header {
        padding: 20px;
    }

    .logo {
        font-size: 10px;

        letter-spacing: 2px;
    }

    .page {
        font-size: 8px;
    }

    main {
        padding-top: 15px;
        padding-bottom: 70px;
    }

    .eyebrow {
        font-size: 8px;

        letter-spacing: 2px;
    }

    h1 {
        font-size: 43px;

        margin-bottom: 8px;
    }

    .subtitle {
        font-size: 11px;

        max-width: 330px;

        margin-bottom: 8px;
    }

    .universe {
        width: 330px;

        height: 245px;
    }

    .orbit {
        width: 180px;
        height: 180px;
    }

    .center {
        width: 75px;
        height: 75px;

        font-size: 30px;
    }

    .star {
        width: 38px;
        height: 38px;

        font-size: 14px;
    }

    .message {
        width: 280px;
    }

    .continue {
        margin-top: 15px;

        padding: 11px 25px;
    }

}

</style>

</head>


<body>


<div class="space"></div>

<div class="glow glow-one"></div>

<div class="glow glow-two"></div>


<header>

    <div class="logo">
        LOVE UNIVERSE
    </div>

    <div class="page">
        06 / 10
    </div>

</header>


<main>


    <div class="eyebrow">
        ✦ A LITTLE UNIVERSE OF US ✦
    </div>


    <h1>
        A universe<br>
        <span>made of you.</span>
    </h1>


    <p class="subtitle">
        If I had to collect all the little things
        I love about you, they would fill a universe.
    </p>


    <div class="universe">


        <div class="orbit"></div>


        <div class="center">
            ♥
        </div>


        <button
            class="star star-one"
            onclick="showMessage(1)">
            ✦
        </button>


        <button
            class="star star-two"
            onclick="showMessage(2)">
            ✦
        </button>


        <button
            class="star star-three"
            onclick="showMessage(3)">
            ✦
        </button>


        <button
            class="star star-four"
            onclick="showMessage(4)">
            ✦
        </button>


        <button
            class="star star-five"
            onclick="showMessage(5)">
            ✦
        </button>


        <div
            class="message"
            id="message">

            <p id="messageText">
                Click a star...
            </p>

        </div>


    </div>


    <div class="instruction">
        ✦ CLICK THE STARS ✦
    </div>


    <!-- ALWAYS VISIBLE -->

    <a
        href="page7.html"
        class="continue">

        Continue →

    </a>


</main>


<footer>
    LOVE UNIVERSE &nbsp; ∞
</footer>


<script>

function showMessage(number) {

    const text =
        document.getElementById("messageText");

    const message =
        document.getElementById("message");


    const messages = {

        1:
        "Your smile can make even the hardest day feel a little lighter. ♡",

        2:
        "I love the way even ordinary conversations with you become memories. ✦",

        3:
        "Somehow, you make simple moments feel like something worth keeping forever. ♥",

        4:
        "If comfort had a person, I think it would look a little like you. ♡",

        5:
        "Out of all the stars in this universe, you're still my favorite one. ∞"

    };


    text.innerHTML =
        messages[number];

    message.classList.add("show");

}

</script>


</body>

</html>
